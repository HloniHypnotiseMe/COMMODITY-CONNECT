name: Commodity Connect CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run test:domain
      - run: npm run check
      - run: npm run build
      - run: node --check pb_migrations/1720000000_create_commodity.js
      - run: node --check pb_migrations/1720000001_harden_commodity_lifecycle.js
      - run: node --check pb_hooks/commodity.pb.js